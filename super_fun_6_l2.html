    function playAudio(text) {
      if (!('speechSynthesis' in window)) {
        showToast("您的瀏覽器不支援語音合成功能，建議使用 Chrome / Edge。");
        return;
      }
      window.speechSynthesis.cancel(); // Stop current playing speech
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = currentSpeechRate;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

                    ${isChecked ? `

                        ${isCorrect ? '✓ 配對正確！' : `✕ 應為 (${q.expected})。${q.hint}`}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Part 2: Henry's Schedule -->
          <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
            <div class="flex items-center gap-2 mb-3">
              <span class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 font-bold text-xs flex items-center justify-center">2</span>
              <h3 class="font-extrabold text-slate-800 text-base">Henry 的作息配對 (Henry's Schedule)</h3>
            </div>

            <!-- Code Reference Card -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs text-slate-700 font-medium">
              <div class="bg-white p-2 rounded-lg border border-slate-200 flex items-center gap-2">
                <span class="font-bold text-indigo-600">(a)</span> <span>寫功課 (Do homework)</span>
              </div>
              <div class="bg-white p-2 rounded-lg border border-slate-200 flex items-center gap-2">
                <span class="font-bold text-indigo-600">(b)</span> <span>吃晚餐 (Eat dinner)</span>
              </div>
              <div class="bg-white p-2 rounded-lg border border-slate-200 flex items-center gap-2">
                <span class="font-bold text-indigo-600">(c)</span> <span>睡覺 (Go to bed)</span>
              </div>
              <div class="bg-white p-2 rounded-lg border border-slate-200 flex items-center gap-2">
                <span class="font-bold text-indigo-600">(d)</span> <span>洗澡 (Take a shower)</span>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              ${part2Items.map((q, idx) => {
                const selected = userAnswers.stage6[q.id];
                const isCorrect = selected === q.expected;
                return `
                  <div class="bg-slate-50/70 rounded-xl p-3 border ${isChecked ? (isCorrect ? 'border-emerald-400 bg-emerald-50/20' : 'border-rose-400 bg-rose-50/20') : 'border-slate-200'}">
                    <div class="flex justify-between items-center mb-2">
                      <span class="text-xs font-mono font-bold bg-indigo-900 text-emerald-400 px-2.5 py-0.5 rounded">${q.timeLabel}</span>
                      <button onclick="playAudio('${q.tts}')" class="px-2 py-0.5 rounded bg-white hover:bg-slate-100 text-indigo-600 text-xs font-bold transition flex items-center gap-1 border border-slate-200 shadow-sm">
                        <i class="fa-solid fa-volume-high"></i> 聽 Henry 說
                      </button>
                    </div>
                    
                    <div class="mt-3">
                      <label class="text-xs text-slate-500 block mb-1">對應 Henry 的作息：</label>
                      <select onchange="selectAnswer('stage6', '${q.id}', this.value)" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-sm font-bold text-slate-700 focus:outline-indigo-500">
                        <option value="">-- 請選擇代碼 --</option>
                        <option value="a" ${selected === 'a' ? 'selected' : ''}>(a) 寫功課</option>
                        <option value="b" ${selected === 'b' ? 'selected' : ''}>(b) 吃晚餐</option>
                        <option value="c" ${selected === 'c' ? 'selected' : ''}>(c) 睡覺</option>
                        <option value="d" ${selected === 'd' ? 'selected' : ''}>(d) 洗澡</option>
                      </select>
                    </div>

                    ${isChecked ? `
                      <div class="mt-2 text-xs font-semibold ${isCorrect ? 'text-emerald-700' : 'text-rose-600'}">
                        ${isCorrect ? '✓ 配對正確！' : `✕ 應為 (${q.expected})。${q.hint}`}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      container.innerHTML = headerHtml + bodyHtml;
      updateProgressBar();
    }

    // ==========================================
    // 4. ANSWER HANDLING & SCORE CALCULATION
    // ==========================================
    function selectAnswer(stageKey, questionId, val) {
      userAnswers[stageKey][questionId] = val;
      renderStageContent();
      updateProgressBar();
    }

    function checkCurrentStageAnswers() {
      stageCheckedState[currentStage] = true;
      const stage = STAGES_CONFIG[currentStage];
      const stageKey = stage.id;
      const answeredInStage = Object.keys(userAnswers[stageKey]).length;
      
      renderStageContent();
      showToast(`已完成第 ${currentStage + 1} 關即時檢核！已作答 ${answeredInStage} / ${stage.totalQuestions} 題`);
    }

    function calculateScores() {
      let totalScore = 0;
      let stageResults = [];
      let totalAnswered = 0;

      // Category points tracking for Diagnostic Radar
      const competency = {
        phonics: { correct: 0, total: 36 },     // Stage 1 (16) + Stage 2 (20)
        vocab: { correct: 0, total: 14 },       // Stage 3 (14)
        dialogue: { correct: 0, total: 12 },    // Stage 5 (12)
        context: { correct: 0, total: 38 }      // Stage 4 (20) + Stage 6 (18)
      };

      STAGES_CONFIG.forEach((stage, idx) => {
        const key = stage.id;
        const qList = QUESTIONS_DATA[key];
        let correctCount = 0;

        qList.forEach(q => {
          if (userAnswers[key][q.id] !== undefined && userAnswers[key][q.id] !== "") {
            totalAnswered++;
          }
          if (userAnswers[key][q.id] === q.expected) {
            correctCount++;
          }
        });

        // Exact strict points calculation to prevent 36/24 overflows
        const earnedPoints = Number((correctCount * stage.pointPerQ).toFixed(1));
        totalScore += earnedPoints;

        // Categorize into competencies
        if (idx === 0 || idx === 1) competency.phonics.correct += earnedPoints;
        else if (idx === 2) competency.vocab.correct += earnedPoints;
        else if (idx === 3 || idx === 5) competency.context.correct += earnedPoints;
        else if (idx === 4) competency.dialogue.correct += earnedPoints;

        stageResults.push({
          stageNumber: stage.number,
          title: stage.title,
          correctCount,
          totalCount: stage.totalQuestions,
          earnedPoints,
          maxPoints: stage.totalPoints
        });
      });

      return {
        totalScore: Math.round(totalScore * 10) / 10,
        totalAnswered,
        stageResults,
        competency
      };
    }

    function updateProgressBar() {
      let count = 0;
      Object.keys(userAnswers).forEach(key => {
        Object.keys(userAnswers[key]).forEach(qId => {
          if (userAnswers[key][qId] !== undefined && userAnswers[key][qId] !== "") {
            count++;
          }
        });
      });
      document.getElementById("answeredCountBadge").innerText = count;
      const pct = Math.round((count / 38) * 100);
      document.getElementById("examProgressBar").style.width = `${pct}%`;
    }

    // ==========================================
    // 5. SUMMARY MODAL & DIAGNOSTIC REPORT
    // ==========================================
    function openFullSubmitModal() {
      // Mark all stages as checked
      for (let i = 0; i < stageCheckedState.length; i++) {
        stageCheckedState[i] = true;
      }
      renderStageContent();

      const studentName = document.getElementById("studentNameInput").value.trim() || "學生自主練習";
      const { totalScore, stageResults, competency } = calculateScores();

      document.getElementById("reportStudentMeta").innerText = `受試學生：${studentName} · 評定時間：${new Date().toLocaleDateString('zh-TW')} ${new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}`;
      document.getElementById("finalTotalScore").innerText = totalScore;

      // Grade badge logic
      const gradeElem = document.getElementById("finalScoreGrade");
      if (totalScore >= 90) {
        gradeElem.innerText = "等級：A+ 精熟卓越 (Excellent)";
        gradeElem.className = "text-xs bg-emerald-400 text-slate-900 font-extrabold px-3 py-1 rounded-full";
      } else if (totalScore >= 80) {
        gradeElem.innerText = "等級：A 基礎穩固 (Proficient)";
        gradeElem.className = "text-xs bg-amber-300 text-slate-900 font-extrabold px-3 py-1 rounded-full";
      } else if (totalScore >= 60) {
        gradeElem.innerText = "等級：B 尚待加強 (Developing)";
        gradeElem.className = "text-xs bg-amber-500 text-white font-extrabold px-3 py-1 rounded-full";
      } else {
        gradeElem.innerText = "等級：C 需個別化輔導 (Needs Scaffold)";
        gradeElem.className = "text-xs bg-rose-500 text-white font-extrabold px-3 py-1 rounded-full";
      }

      // Render Stage breakdown list
      const breakdownContainer = document.getElementById("stageScoresBreakdown");
      breakdownContainer.innerHTML = stageResults.map(s => `
        <div class="bg-white p-2.5 rounded-xl border border-slate-200">
          <div class="text-[11px] text-slate-400 font-bold">第 ${s.stageNumber} 關</div>
          <div class="font-extrabold text-slate-700 text-sm my-0.5">${s.earnedPoints} <span class="text-[10px] text-slate-400">/ ${s.maxPoints}</span></div>
          <div class="text-[10px] text-slate-500 font-medium">${s.correctCount}/${s.totalCount} 題</div>
        </div>
      `).join('');

      // Render Radar / Competency Chart
      renderCompetencyChart(competency);

      // Render Actionable Learning Advice
      renderActionableTips(competency);

      // Show Modal
      document.getElementById("reportModal").classList.remove("hidden");
    }

    function closeReportModal() {
      document.getElementById("reportModal").classList.add("hidden");
    }

    function renderCompetencyChart(comp) {
      const pPct = Math.round((comp.phonics.correct / comp.phonics.total) * 100);
      const vPct = Math.round((comp.vocab.correct / comp.vocab.total) * 100);
      const dPct = Math.round((comp.dialogue.correct / comp.dialogue.total) * 100);
      const cPct = Math.round((comp.context.correct / comp.context.total) * 100);

      const ctx = document.getElementById('competencyChart').getContext('2d');
      if (competencyChartInstance) {
        competencyChartInstance.destroy();
      }

      competencyChartInstance = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: ['音韻辨析 (Phonics)', '片語抓取 (Vocab)', '句型對話 (Dialogue)', '情境推理 (Context)'],
          datasets: [{
            label: '素養達成率 (%)',
            data: [pPct, vPct, dPct, cPct],
            fill: true,
            backgroundColor: 'rgba(99, 102, 241, 0.25)',
            borderColor: 'rgb(79, 70, 229)',
            pointBackgroundColor: 'rgb(79, 70, 229)',
            pointBorderColor: '#fff',
            pointHoverBackgroundColor: '#fff',
            pointHoverBorderColor: 'rgb(79, 70, 229)'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            r: {
              angleLines: { color: '#e2e8f0' },
              grid: { color: '#e2e8f0' },
              suggestedMin: 0,
              suggestedMax: 100,
              ticks: { display: false, stepSize: 25 }
            }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });
    }

    function renderActionableTips(comp) {
      const pPct = Math.round((comp.phonics.correct / comp.phonics.total) * 100);
      const vPct = Math.round((comp.vocab.correct / comp.vocab.total) * 100);
      const dPct = Math.round((comp.dialogue.correct / comp.dialogue.total) * 100);
      const cPct = Math.round((comp.context.correct / comp.context.total) * 100);

      const tipsContainer = document.getElementById("actionableTipsContainer");
      let tipsHtml = `<h4 class="font-bold text-slate-700 text-sm flex items-center gap-2 mb-1"><i class="fa-solid fa-lightbulb text-amber-500"></i> 個別化行動學習建議 (Actionable Advice)</h4>`;

      // Phonics tip
      if (pPct < 85) {
        tipsHtml += `
          <div class="bg-amber-50 border border-amber-200/70 p-3 rounded-xl text-xs text-amber-900 flex items-start gap-2">
            <i class="fa-solid fa-ear-listen text-amber-600 mt-0.5"></i>
            <div>
              <strong>音韻辨析弱項提示：</strong> 注意 /tʃ/ (如 catch, chip) 帶有舌尖先抵住上顎的爆破摩擦感，而 /ʃ/ (如 wish, ship) 則是持續的噓聲氣音；可對著鏡子練習口型。
            </div>
          </div>
        `;
      } else {
        tipsHtml += `
          <div class="bg-emerald-50 border border-emerald-200/70 p-3 rounded-xl text-xs text-emerald-900 flex items-start gap-2">
            <i class="fa-solid fa-check text-emerald-600 mt-0.5"></i>
            <div><strong>音韻辨析表現優異：</strong> 能精確分辨 ch, sh, ph 與 wh 的細微發音特徵！</div>
          </div>
        `;
      }

      // Routine / Context Tip
      if (cPct < 85 || dPct < 85) {
        tipsHtml += `
          <div class="bg-indigo-50 border border-indigo-200/70 p-3 rounded-xl text-xs text-indigo-900 flex items-start gap-2">
            <i class="fa-regular fa-clock text-indigo-600 mt-0.5"></i>
            <div>
              <strong>時間關鍵字聆聽策略：</strong> 聽時間問句時，先捕捉句子後段的時間數字 (如 <em>seven thirty-five</em>) 與動作動詞 (<em>get up / eat dinner</em>)，先在草稿紙寫下數字能大幅提高配對準確率。
            </div>
          </div>
        `;
      } else {
        tipsHtml += `
          <div class="bg-emerald-50 border border-emerald-200/70 p-3 rounded-xl text-xs text-emerald-900 flex items-start gap-2">
            <i class="fa-solid fa-star text-emerald-600 mt-0.5"></i>
            <div><strong>作息時鐘辨識極佳：</strong> 熟練掌握 AM/PM 以及日常生活各個環節的英文表達方式！</div>
          </div>
        `;
      }

      tipsContainer.innerHTML = tipsHtml;
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toastMsg").innerText = msg;
      toast.classList.remove("translate-y-20", "opacity-0");
      setTimeout(() => {
        toast.classList.add("translate-y-20", "opacity-0");
      }, 2600);
    }

    // ==========================================
    // 6. INITIALIZATION
    // ==========================================
    window.onload = function() {
      initTabs();
      changeStage(0);
    };
  </script>
</body>
